name: Validate and optionally publish Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after owner/repository and legal-text confirmation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'pages-publication' || format('pages-validation-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_OWNER: ${{ vars.PAGES_OWNER }}
      PAGES_REPOSITORY: ${{ vars.PAGES_REPOSITORY }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - name: Check publication confirmations
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          PUBLISH_APPROVED: ${{ vars.PUBLISH_APPROVED }}
          LEGAL_TEXT_APPROVED: ${{ vars.LEGAL_TEXT_APPROVED }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLISH_APPROVED" = true
          test "$LEGAL_TEXT_APPROVED" = true
          test -n "$PAGES_OWNER"
          test -n "$PAGES_REPOSITORY"
          test "$PAGES_OWNER/$PAGES_REPOSITORY" = "$GITHUB_REPOSITORY"
          node <<'NODE'
          const origin = new URL(process.env.SITE_URL || `https://${process.env.PAGES_OWNER}.github.io`);
          const hostname = origin.hostname;
          if (hostname === 'localhost' || hostname.endsWith('.invalid') || hostname === '127.0.0.1') {
            throw new Error('Publication requires a public SITE_URL, not a local or placeholder origin.');
          }
          if (origin.protocol !== 'https:' || origin.pathname !== '/' || origin.search || origin.hash || origin.username || origin.password) {
            throw new Error('Publication requires SITE_URL to be an HTTPS origin without a path, query, fragment, or credentials.');
          }
          console.log(`Publishing site configured for ${origin.origin}`);
          NODE
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate root and project URL layouts
        env:
          SITE_URL: https://example.invalid
          SITE_INDEXABLE: 'false'
          ALGOLIA_APP_ID: ''
          ALGOLIA_SEARCH_API_KEY: ''
          ALGOLIA_INDEX_NAME: ''
        run: |
          for base_url in / /repoprompt-ce-user-docs/; do
            SITE_BASE_URL="$base_url" pnpm run build
          done
      # Restore the repository-configured artifact after the validation builds.
      - name: Build configured site
        run: pnpm run build
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && vars.PUBLISH_APPROVED == 'true' && vars.LEGAL_TEXT_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
