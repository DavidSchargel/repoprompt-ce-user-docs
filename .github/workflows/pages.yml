name: Validate and optionally publish Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after owner/repository and legal-text confirmation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'pages-publication' || format('pages-validation-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_OWNER: ${{ vars.PAGES_OWNER }}
      PAGES_REPOSITORY: ${{ vars.PAGES_REPOSITORY }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
      ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm 12.x
        uses: pnpm/action-setup@v6
        with:
          version: '12.x'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Check publication confirmations
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          PUBLISH_APPROVED: ${{ vars.PUBLISH_APPROVED }}
          LEGAL_TEXT_APPROVED: ${{ vars.LEGAL_TEXT_APPROVED }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLISH_APPROVED" = true
          test "$LEGAL_TEXT_APPROVED" = true
          test -n "$PAGES_OWNER"
          test -n "$PAGES_REPOSITORY"
          test "$PAGES_OWNER/$PAGES_REPOSITORY" = "$GITHUB_REPOSITORY"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && vars.PUBLISH_APPROVED == 'true' && vars.LEGAL_TEXT_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
